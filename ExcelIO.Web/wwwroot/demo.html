<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExcelIO Demo</title>
  <link rel="stylesheet" href="demo.css">
  <script type="module" src="./main.js"></script>
</head>
<body>
  <div id="toolbar">
    <label class="btn" for="file-input" id="upload-label">Open</label>
    <input type="file" id="file-input" accept=".xlsx,.xlsm,.xls" hidden>
    <button class="btn" id="btn-new">New</button>
    <button class="btn" id="btn-save" disabled>Save</button>
    <span id="filename"></span>
    <span id="error-msg"></span>
  </div>

  <div id="sheet-tabs"></div>

  <div id="grid-container">
    <div id="grid-scroll">
      <table id="grid"></table>
    </div>
  </div>

  <script src="demo.js"></script>
</body>
</html>
